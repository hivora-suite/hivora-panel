requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: admin 8080/tcp
    type: port
    default: 8080
  - id: executor_port_9999
    group:
      fr: Accès
      en: Access
    label: executor 9999/tcp
    type: port
    default: 9999
services:
  admin:
    role: main
    image: vulhub/xxl-job
    tag: 2.2.0-admin@sha256:866a03fa6b66feb502a9b51deb6b0a8fd5a9c2409415e55d9c6e861d5aea30b5
    frozen: true
    depends_on:
    - db
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  executor:
    role: sidecar
    image: vulhub/xxl-job
    tag: 2.2.0-executor@sha256:4f30b45a326bc9928fe2f4adcf1e71030b6b5cc64a9e0e9406aabf5f11ca1c7d
    frozen: true
    depends_on:
    - admin
    ports:
    - container: 9999
      host: '{{ form.executor_port_9999 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  db:
    role: database
    image: mysql
    tag: 5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
