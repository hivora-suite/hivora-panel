requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: web 80/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/ecshop
    tag: 4.0.6@sha256:7c8b2f067a680e228d3ad4ac8c202dd357a6e0931b3999acf399295cc6b332e2
    frozen: true
    depends_on:
    - mysql
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  mysql:
    role: database
    image: mysql
    tag: 5.5@sha256:12da85ab88aedfdf39455872fb044f607c32fdc233cd59f1d26769fbf439b045
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
