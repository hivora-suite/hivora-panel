requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: web 80/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/magento
    tag: 2.2.7@sha256:920f0dd512a25de1992cd444d3edc56e6131f840e65ae1ba3262aa276ed5304e
    frozen: true
    depends_on:
    - mysql
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  mysql:
    role: database
    image: mysql
    tag: 5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
