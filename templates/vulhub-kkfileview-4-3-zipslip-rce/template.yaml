apiVersion: hivora/v1
kind: Template
metadata:
  slug: vulhub-kkfileview-4-3-zipslip-rce
  name: kkFileView
  version: 1.1.0
  category: security-lab
  tags:
  - vulhub
  - kkfileview
  description: kkFileView ZipSlip Remote Code Execution (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/kkfileview/4.3-zipslip-rce
  maintainer: vulhub
  license: MIT (vulhub)
  source: https://github.com/vulhub/vulhub/tree/master/kkfileview/4.3-zipslip-rce
  lab:
    phase: exploitation
    cves: []
    os:
    - linux
    tech:
    - path-traversal
    - rce
    summary:
      fr: Traversée de répertoires → exécution de code
      en: Path traversal → code execution
    solution:
      fr: |
        Adresse : IP:port affichés par le panel (les ports du guide sont ceux d'origine de vulhub), ou l'IP du lab sur le port d'origine via le VPN labo. Guide d'origine (anglais) : https://github.com/vulhub/vulhub/tree/master/kkfileview/4.3-zipslip-rce
        kkFileView is an open source document online preview solution.
        In the version prior to 4.4.0-beta, kkFileView has a ZipSlip issue. Attackers can use this issue to upload arbitrary files to the server and execute code.
        References:
        - <https://github.com/luelueking/kkFileView-v4.3.0-RCE-POC>
        # Vulnerable environment
        Execute following command to start a kkFileView 3.4.0:
        $ docker compose up -d
        After the server is started, you can see the index page at `http://your-ip:8012`.
        # Exploit
        First, generate a craft POC by poc.py (poc.py):
        $ python poc.py
        A `test.zip` file will be written.
        Upload `test.zip` and the sample.odt (samople.odt) to the kkFileView server:
        Then, click the "preview" button of `test.zip`, the zip file will be listed:
        Finally, click the "preview" button of `sample.odt`.
        You can see the `touch /tmp/success` has been executed successful:
      en: |
        Address: the IP:port shown by the panel (the guide's ports are vulhub's original ones), or the lab's IP on the original port through the labs VPN. Original guide: https://github.com/vulhub/vulhub/tree/master/kkfileview/4.3-zipslip-rce
        kkFileView is an open source document online preview solution.
        In the version prior to 4.4.0-beta, kkFileView has a ZipSlip issue. Attackers can use this issue to upload arbitrary files to the server and execute code.
        References:
        - <https://github.com/luelueking/kkFileView-v4.3.0-RCE-POC>
        # Vulnerable environment
        Execute following command to start a kkFileView 3.4.0:
        $ docker compose up -d
        After the server is started, you can see the index page at `http://your-ip:8012`.
        # Exploit
        First, generate a craft POC by poc.py (poc.py):
        $ python poc.py
        A `test.zip` file will be written.
        Upload `test.zip` and the sample.odt (samople.odt) to the kkFileView server:
        Then, click the "preview" button of `test.zip`, the zip file will be listed:
        Finally, click the "preview" button of `sample.odt`.
        You can see the `touch /tmp/success` has been executed successful:
requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8012
    group:
      fr: Accès
      en: Access
    label: web 8012/tcp
    type: port
    default: 8012
  - id: port_5005
    group:
      fr: Accès
      en: Access
    label: web 5005/tcp
    type: port
    default: 5005
services:
  web:
    role: main
    image: vulhub/kkfileview
    tag: 4.3.0@sha256:378bf1c6ddc94f05bf7cb26f9bbf087dc49024c04fe7121d740281c9b51e40f0
    frozen: true
    ports:
    - container: 8012
      host: '{{ form.port_8012 }}'
      protocol: tcp
      purpose: web
      exposure: lan
    - container: 5005
      host: '{{ form.port_5005 }}'
      protocol: tcp
      purpose: other
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8012 }}
