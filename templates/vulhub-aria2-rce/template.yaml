requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_6800
    group:
      fr: Accès
      en: Access
    label: aria2 6800/tcp
    type: port
    default: 6800
services:
  aria2:
    role: main
    image: vulhub/aria2
    tag: 1.18.8@sha256:760ff890d69226deba6fe3476b9be7844b83fd4f1540b40f8593cd8f812c49f6
    frozen: true
    ports:
    - container: 6800
      host: '{{ form.port_6800 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_6800 }}
