requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: ecshop27 80/tcp
    type: port
    default: 8080
  - id: ecshop36_port_80
    group:
      fr: Accès
      en: Access
    label: ecshop36 80/tcp
    type: port
    default: 8081
services:
  ecshop27:
    role: main
    image: vulhub/ecshop
    tag: 2.7.3@sha256:72c02687146dba381aa189a4fe73b5bca80aea3c14259991796245a2c9a16f19
    frozen: true
    depends_on:
    - mysql
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  ecshop36:
    role: sidecar
    image: vulhub/ecshop
    tag: 3.6.0@sha256:bcdce78534f8d40c446f39119436f3b1903a759c3fa4c849fc60b5b74d03d925
    frozen: true
    depends_on:
    - mysql
    ports:
    - container: 80
      host: '{{ form.ecshop36_port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  mysql:
    role: database
    image: mysql
    tag: 5.5@sha256:12da85ab88aedfdf39455872fb044f607c32fdc233cd59f1d26769fbf439b045
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
