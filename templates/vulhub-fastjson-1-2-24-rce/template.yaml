requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8090
    group:
      fr: Accès
      en: Access
    label: web 8090/tcp
    type: port
    default: 8090
services:
  web:
    role: main
    image: vulhub/fastjson
    tag: 1.2.24@sha256:4e61ce0bcf003d736b11e94fd9204b05e00827c021b6c09a3de9340856e4f158
    frozen: true
    ports:
    - container: 8090
      host: '{{ form.port_8090 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8090 }}
