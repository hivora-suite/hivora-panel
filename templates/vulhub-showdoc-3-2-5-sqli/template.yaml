        $ python3 poc.py -u http://localhost:8080
        To test if the token is valid:
requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: web 80/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/showdoc
    tag: 3.2.4@sha256:d7bddb43023f2f5149c681a5c25c0bdec42e6bd706c33803694e6d31fbfb589d
    frozen: true
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
