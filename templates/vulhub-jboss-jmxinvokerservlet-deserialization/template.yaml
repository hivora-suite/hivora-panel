apiVersion: hivora/v1
kind: Template
metadata:
  slug: vulhub-jboss-jmxinvokerservlet-deserialization
  name: JBoss
  version: 1.1.0
  category: security-lab
  tags:
  - vulhub
  - jboss
  description: JBoss JMXInvokerServlet Deserialization Remote Code Execution (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/jboss/JMXInvokerServlet-deserialization
  maintainer: vulhub
  license: MIT (vulhub)
  source: https://github.com/vulhub/vulhub/tree/master/jboss/JMXInvokerServlet-deserialization
  lab:
    phase: exploitation
    cves: []
    os:
    - linux
    tech:
    - deserialization
    - rce
    - webserver
    summary:
      fr: Désérialisation non sûre → exécution de code
      en: Insecure deserialization → code execution
    solution:
      fr: |
        Adresse : IP:port affichés par le panel (les ports du guide sont ceux d'origine de vulhub), ou l'IP du lab sur le port d'origine via le VPN labo. Guide d'origine (anglais) : https://github.com/vulhub/vulhub/tree/master/jboss/JMXInvokerServlet-deserialization
        Red Hat JBoss Application Server is a JavaEE-based open source application server.
        This is a classic JBoss deserialization vulnerability where JBoss reads user-supplied objects in the `/invoker/JMXInvokerServlet` request, allowing attackers to execute arbitrary code using Gadgets from Apache Commons Collections.
        References:
        - https://foxglovesecurity.com/2015/11/06/what-do-weblogic-websphere-jboss-jenkins-opennms-and-your-application-have-in-common-this-vulnerability/
        - https://www.seebug.org/vuldb/ssvid-89723
        - http://www.freebuf.com/sectool/88908.html
        - https://paper.seebug.org/312/
        # Environment Setup
        Execute the following command to start JBoss AS 6.1.0:
        $ docker compose up -d
        The initial setup will take 1-3 minutes. After initialization is complete, visit `http://your-ip:8080/` to see the JBoss default page.
        # Vulnerability Reproduce
        When JBoss processes the `/invoker/JMXInvokerServlet` request, it reads the object directly. Therefore, we can simply attach a POC generated by ysoserial (https://github.com/frohoff/ysoserial) in the POST Body. The entire process is similar to jboss/CVE-2017-12149 (https://github.com/vulhub/vulhub/tree/master/jboss/CVE-2017-12149), so I won't repeat it here.
        There are many existing exploits available online. For example, you can use DeserializeExploit.jar (https://file.vulhub.org/download/deserialization/DeserializeExploit.jar) to directly execute commands and upload files:
      en: |
        Address: the IP:port shown by the panel (the guide's ports are vulhub's original ones), or the lab's IP on the original port through the labs VPN. Original guide: https://github.com/vulhub/vulhub/tree/master/jboss/JMXInvokerServlet-deserialization
