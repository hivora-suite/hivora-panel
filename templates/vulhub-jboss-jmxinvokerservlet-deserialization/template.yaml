requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_9990
    group:
      fr: Accès
      en: Access
    label: jboss 9990/tcp
    type: port
    default: 9990
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: jboss 8080/tcp
    type: port
    default: 8080
services:
  jboss:
    role: main
    image: vulhub/jboss
    tag: as-6.1.0@sha256:1b91acd3e71e966f8bbeae7134dd1e2e183f4973955ae66defbc0abe8e572fec
    frozen: true
    ports:
    - container: 9990
      host: '{{ form.port_9990 }}'
      protocol: tcp
      purpose: other
      exposure: lan
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
