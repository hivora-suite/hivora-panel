requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: struts2 8080/tcp
    type: port
    default: 8080
services:
  struts2:
    role: main
    image: vulhub/struts2
    tag: 2.3.30@sha256:b992e080d8e5ad332bf526ae26124d28f56ca4fc9e0eaa91510dbee9870eb2c8
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
