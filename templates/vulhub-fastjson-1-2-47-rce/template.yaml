requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8090
    group:
      fr: Accès
      en: Access
    label: web 8090/tcp
    type: port
    default: 8090
services:
  web:
    role: main
    image: vulhub/fastjson
    tag: 1.2.45@sha256:9f51d38b03850fb12e58adbbfe3c0c216390e4b07ea9cd98516ea6157f85e8ce
    frozen: true
    ports:
    - container: 8090
      host: '{{ form.port_8090 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
