metadata:
  slug: vulhub-fastjson-1-2-47-rce
  name: Fastjson 1.2.47 Deserialization Remote Command Execution
  version: 1.0.0
  category: security-lab
  tags:
  - vulhub
  - fastjson
  description: Fastjson — Fastjson 1.2.47 Deserialization Remote Command Execution (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/fastjson/1.2.47-rce
  maintainer: vulhub
