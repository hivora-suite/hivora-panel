requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: master 8080/tcp
    type: port
    default: 8080
  - id: port_7077
    group:
      fr: Accès
      en: Access
    label: master 7077/tcp
    type: port
    default: 7077
  - id: port_6066
    group:
      fr: Accès
      en: Access
    label: master 6066/tcp
    type: port
    default: 6066
  - id: slave_port_8081
    group:
      fr: Accès
      en: Access
    label: slave 8081/tcp
    type: port
    default: 8081
services:
  master:
    role: main
    image: vulhub/spark
    tag: 2.3.1@sha256:e276c20510a629dfbb6c1c88812515c6acaaaacf4dd7a9dd5820d3a83442a380
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
    - container: 7077
      host: '{{ form.port_7077 }}'
      protocol: tcp
      purpose: other
      exposure: lan
    - container: 6066
      host: '{{ form.port_6066 }}'
      protocol: tcp
      purpose: other
      exposure: lan
  slave:
    role: sidecar
    image: vulhub/spark
    tag: 2.3.1@sha256:e276c20510a629dfbb6c1c88812515c6acaaaacf4dd7a9dd5820d3a83442a380
    frozen: true
    command: slave spark://master:7077
    depends_on:
    - master
    ports:
    - container: 8081
      host: '{{ form.slave_port_8081 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
