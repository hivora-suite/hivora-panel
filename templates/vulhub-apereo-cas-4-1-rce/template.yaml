metadata:
  slug: vulhub-apereo-cas-4-1-rce
  name: Apereo CAS
  version: 1.1.0
  category: security-lab
  tags:
  - vulhub
  - apereo-cas
  description: Apereo CAS 4.1 Deserialization Command Execution (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/apereo-cas/4.1-rce
  maintainer: vulhub
