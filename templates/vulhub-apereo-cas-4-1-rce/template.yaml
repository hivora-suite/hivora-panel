requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: web 8080/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/apereo-cas
    tag: 4.1.5@sha256:82f6de470fd94cfa6e210541a5d10f8a8bf0b941759afb1239101653e6e451dd
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
