requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: discuz 80/tcp
    type: port
    default: 8080
services:
  discuz:
    role: main
    image: vulhub/discuz
    tag: 7.2@sha256:f09fa4fad495873741c9542b8681ea21f5ca796999c4172fc5df1539d206ad17
    frozen: true
    depends_on:
    - db
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  db:
    role: database
    image: mysql
    tag: 5.5@sha256:12da85ab88aedfdf39455872fb044f607c32fdc233cd59f1d26769fbf439b045
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: discuz
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
