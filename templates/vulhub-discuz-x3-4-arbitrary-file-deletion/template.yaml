requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: discuz 80/tcp
    type: port
    default: 80
services:
  discuz:
    role: main
    image: vulhub/discuz
    tag: x3.4@sha256:ee8ce1db2c71005a41f964d0a66e33b71286ad0674b55ef18b12eecf4c07c3a3
    frozen: true
    depends_on:
    - db
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  db:
    role: database
    image: mysql
    tag: 5.5@sha256:12da85ab88aedfdf39455872fb044f607c32fdc233cd59f1d26769fbf439b045
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ultrax
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
