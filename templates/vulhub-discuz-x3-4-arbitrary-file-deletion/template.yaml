metadata:
  slug: vulhub-discuz-x3-4-arbitrary-file-deletion
  name: Discuz!
  version: 1.1.0
  category: security-lab
  tags:
  - vulhub
  - discuz
  description: Discuz!X <= 3.4 Arbitrary File Deletion (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/discuz/x3.4-arbitrary-file-deletion
  maintainer: vulhub
