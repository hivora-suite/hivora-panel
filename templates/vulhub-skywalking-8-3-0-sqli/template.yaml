requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: web 8080/tcp
    type: port
    default: 8080
services:
  oap:
    role: sidecar
    image: vulhub/skywalking
    tag: 8.3.0@sha256:2c4debbd8c173afa1370b336f0595ec895438bf630e5a02500bf33b9c2c3cae1
    frozen: true
    command: bash bin/oap-service.sh
  web:
    role: main
    image: vulhub/skywalking
    tag: 8.3.0@sha256:2c4debbd8c173afa1370b336f0595ec895438bf630e5a02500bf33b9c2c3cae1
    frozen: true
    env:
      COLLECTOR_RIBBON_LISTOFSERVERS: oap:12800
    command: bash bin/web-server.sh
    depends_on:
    - oap
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
