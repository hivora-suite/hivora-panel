requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: struts2 8080/tcp
    type: port
    default: 8080
services:
  struts2:
    role: main
    image: vulhub/struts2
    tag: 2.3.32-showcase@sha256:138fc8c39303cad97500918a97932dd399209ec2b08228f4648b91e0378b832d
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
