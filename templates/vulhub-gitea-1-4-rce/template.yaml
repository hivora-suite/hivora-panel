requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_3000
    group:
      fr: Accès
      en: Access
    label: web 3000/tcp
    type: port
    default: 3000
  - id: port_22
    group:
      fr: Accès
      en: Access
    label: web 22/tcp
    type: port
    default: 20022
services:
  web:
    role: main
    image: vulhub/gitea
    tag: 1.4.0@sha256:1cf5283b8139c72ac6775602a77e7d61e5f2efa82e085f2734b9f3b3f9388700
    frozen: true
    ports:
    - container: 3000
      host: '{{ form.port_3000 }}'
      protocol: tcp
      purpose: web
      exposure: lan
    - container: 22
      host: '{{ form.port_22 }}'
      protocol: tcp
      purpose: other
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_3000 }}
