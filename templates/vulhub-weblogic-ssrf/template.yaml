requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_7001
    group:
      fr: Accès
      en: Access
    label: weblogic 7001/tcp
    type: port
    default: 7001
services:
  weblogic:
    role: main
    image: vulhub/weblogic
    tag: 10.3.6.0-2017@sha256:275ec19477cfda389dc1c42158033e7e8c650dd4cba9f090ca0ba673902b73c9
    frozen: true
    depends_on:
    - redis
    ports:
    - container: 7001
      host: '{{ form.port_7001 }}'
      protocol: tcp
      purpose: web
      exposure: lan
  redis:
    role: sidecar
    image: vulhub/baselinux
    tag: centos-6@sha256:47854618dcdc80eb14e92cff51f3eb728683cf177b8eabe91863d1d6889e5d64
    frozen: true
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_7001 }}
