requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: struts2 8080/tcp
    type: port
    default: 8080
services:
  struts2:
    role: main
    image: vulhub/struts2
    tag: 2.5.25@sha256:eaf49b95f2c178cca77d3c8454f79a4fe4ed4dd9d342c9e9a911e842565217d2
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
