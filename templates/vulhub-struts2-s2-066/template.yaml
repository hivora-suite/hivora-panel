requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8080
    group:
      fr: Accès
      en: Access
    label: struts2 8080/tcp
    type: port
    default: 8080
  - id: port_5005
    group:
      fr: Accès
      en: Access
    label: struts2 5005/tcp
    type: port
    default: 5005
services:
  struts2:
    role: main
    image: vulhub/struts2
    tag: s2-066@sha256:6c1ddc03f81b9a353acacf24298e4d715e1dab6ebeafcf0038d963e2d73e2970
    frozen: true
    ports:
    - container: 8080
      host: '{{ form.port_8080 }}'
      protocol: tcp
      purpose: web
      exposure: lan
    - container: 5005
      host: '{{ form.port_5005 }}'
      protocol: tcp
      purpose: other
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8080 }}
