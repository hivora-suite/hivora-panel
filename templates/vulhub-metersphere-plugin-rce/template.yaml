requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_8081
    group:
      fr: Accès
      en: Access
    label: web 8081/tcp
    type: port
    default: 8081
  - id: port_5005
    group:
      fr: Accès
      en: Access
    label: web 5005/tcp
    type: port
    default: 5005
services:
  web:
    role: main
    image: vulhub/metersphere
    tag: 1.16.3@sha256:bbb09dbc998388798eb1c0a40c304d8b44e4118607cb2d3c8e34931dc092d095
    frozen: true
    env:
      MYSQL_SERVER: db:3306
      MYSQL_DB: metersphere
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      KAFKA_SERVER: kafka:9092
    ports:
    - container: 8081
      host: '{{ form.port_8081 }}'
      protocol: tcp
      purpose: web
      exposure: lan
    - container: 5005
      host: '{{ form.port_5005 }}'
      protocol: tcp
      purpose: other
      exposure: lan
  db:
    role: database
    image: mysql
    tag: 5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metersphere
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" --max-connections=8000
  kafka:
    role: sidecar
    image: apache/kafka
    tag: 3.7.0@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    frozen: true
    env:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_8081 }}
