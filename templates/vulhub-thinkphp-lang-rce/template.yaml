requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: web 80/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/thinkphp
    tag: 6.0.12@sha256:c0b7769df81e50921b80d1647622d9f398c5bd11c4d39e5ce7c0b43bdfbd5a9e
    frozen: true
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
