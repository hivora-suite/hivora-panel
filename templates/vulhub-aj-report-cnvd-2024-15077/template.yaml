requirements:
  arch:
  - amd64
form:
  basic:
  - id: port_9095
    group:
      fr: Accès
      en: Access
    label: web 9095/tcp
    type: port
    default: 9095
  - id: port_5005
    group:
      fr: Accès
      en: Access
    label: web 5005/tcp
    type: port
    default: 5005
services:
  web:
    role: main
    image: vulhub/aj-report
    tag: 1.4.0@sha256:586f2ae961586f7d5f608707a060b5c6f8ba6d9e98c095242196b0750e6d982c
    frozen: true
    env:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_DB: aj_report
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
    depends_on:
    - db
    ports:
    - container: 9095
      host: '{{ form.port_9095 }}'
      protocol: tcp
      purpose: web
      exposure: lan
    - container: 5005
      host: '{{ form.port_5005 }}'
      protocol: tcp
      purpose: other
      exposure: lan
  db:
    role: database
    image: mysql
    tag: 5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    frozen: true
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aj_report
update:
  strategy: manual
access:
  web: http://{{ host.lan_ip }}:{{ form.port_9095 }}
